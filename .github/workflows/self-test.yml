name: Self-test

# qt-265 (v2): the nark-action self-test. Every PR + main push runs
# the action against the bundled demo project shipped by the nark npm
# package itself (`npx nark --demo` extracts a sample TS project with
# intentional axios/stripe/@prisma/client violations). That gives us
# a deterministic ~7-violation baseline to assert against — without
# having to wire up a separate fixture repo just for the action.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The "happy path" — verify the action wires up nark, writes the
  # audit JSON, summarizes, uploads the artifact, and surfaces the
  # output values to the caller. Inlines a minimal axios fixture so
  # the test is deterministic and independent of whatever nark version
  # is currently on npm (the qt-256 bundled-demo path requires nark
  # >=2.5.0 which isn't published yet as of this PR).
  self-test:
    name: self-test against inline axios fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build a minimal TS project that exercises the axios profile.
      # Three intentional violations (no try/catch around axios.get /
      # axios.post / axios with a generic catch that doesn't handle
      # 429). The fixture needs node_modules with axios installed so
      # nark's TS analyzer can resolve the import — without it, every
      # call resolves to `any` and nark's qt-179 pre-scan check bails.
      - name: Stage inline fixture
        run: |
          mkdir -p fixture/src
          cat > fixture/package.json <<'EOF'
          {
            "name": "nark-action-self-test-fixture",
            "version": "0.0.0",
            "private": true,
            "dependencies": { "axios": "^1.7.0" }
          }
          EOF
          cat > fixture/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "commonjs",
              "lib": ["ES2020"],
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "moduleResolution": "node"
            },
            "include": ["src/**/*.ts"]
          }
          EOF
          cat > fixture/src/api.ts <<'EOF'
          import axios from "axios";

          // VIOLATION: no try/catch — axios rejects on network errors / 4xx / 5xx.
          export async function fetchUser(id: string) {
            const res = await axios.get(`https://api.example.com/users/${id}`);
            return res.data;
          }

          // VIOLATION: no try/catch on POST — even more dangerous because retrying
          // naively could double-post without an idempotency key.
          export async function createUser(name: string) {
            const res = await axios.post("https://api.example.com/users", { name });
            return res.data;
          }
          EOF
          cd fixture && npm install --no-audit --no-fund

      # Run the action under test against the inline fixture.
      # report-only: 'true' so the deliberate violations don't fail
      # the workflow — we're testing the action's output handling,
      # not gating on its findings.
      - name: Run nark-action under test
        id: nark
        uses: ./
        with:
          tsconfig: ./fixture/tsconfig.json
          report-only: 'true'
          artifact-name: self-test-audit

      # Assert the action populated its outputs with non-empty values
      # parsed from the audit JSON. The fixture has 2 deliberate
      # axios calls without try/catch, so we expect at least 2
      # violations.
      - name: Assert outputs
        run: |
          echo "audit-path: ${{ steps.nark.outputs.audit-path }}"
          echo "total-violations: ${{ steps.nark.outputs.total-violations }}"
          echo "error-count: ${{ steps.nark.outputs.error-count }}"
          echo "warning-count: ${{ steps.nark.outputs.warning-count }}"

          test -n "${{ steps.nark.outputs.audit-path }}" || {
            echo "::error::audit-path output is empty"
            exit 1
          }
          test "${{ steps.nark.outputs.total-violations }}" -gt 0 || {
            echo "::error::expected non-zero violations from the inline axios fixture"
            exit 1
          }
          test -f "${{ steps.nark.outputs.audit-path }}" || {
            echo "::error::action reported audit-path but file is missing"
            exit 1
          }

  # The "verify-artifact catches silent failure" path. Force the
  # scanner to crash before producing output (impossible tsconfig
  # path) and assert the action fails loud instead of reporting
  # green. continue-on-error: true on the action step + an explicit
  # outcome check after = the test passes only if the action's
  # internal verify step surfaced the failure.
  verify-artifact-test:
    name: verify-artifact catches silent failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run nark-action with bogus tsconfig
        id: nark
        uses: ./
        continue-on-error: true
        with:
          tsconfig: ./this-file-does-not-exist.json
          upload-artifact: 'false'

      - name: Assert verify-artifact reported failure
        run: |
          # outcome: real exit code from the action step
          # conclusion: post-continue-on-error verdict (always 'success' here)
          echo "outcome: ${{ steps.nark.outcome }}"
          echo "conclusion: ${{ steps.nark.conclusion }}"

          if [ "${{ steps.nark.outcome }}" != "failure" ]; then
            echo "::error::expected outcome=failure when nark crashes; got '${{ steps.nark.outcome }}'"
            echo "::error::this is the silent-success failure mode the v2 verify-artifact step is supposed to catch"
            exit 1
          fi
